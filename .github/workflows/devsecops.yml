name: DevSecOps Pipeline

on:
  push:
    branches: [ master, dev, production ]
  pull_request:
    branches: [ master, production ]

jobs:
  build-and-scan:
    name: Build, Containerize & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: TypeScript compile check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

      - name: Start application container
        run: |
          docker run -d --name juice-shop \
            -p 3000:3000 \
            -e NODE_ENV=production \
            juice-shop:${{ github.sha }}
          echo "Waiting for app to start..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000; do sleep 5; done'
          echo "App is up"

      - name: Fix workspace permissions for ZAP
        run: chmod 777 ${{ github.workspace }}

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: ''
          fail_action: true
          allow_issue_writing: false

      - name: Upload ZAP security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap_report
          path: report_html.html
          retention-days: 30

      - name: Stop container
        if: always()
        run: docker stop juice-shop || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and deploy via Docker Compose
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build
          docker compose ps