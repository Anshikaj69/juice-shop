name: DevSecOps Pipeline

on:
  push:
    branches: [ master, dev, production ]
  pull_request:
    branches: [ master, production ]

jobs:
  build-and-scan:
    name: Build, Containerize & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. CHECKOUT ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. NODE SETUP ─────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. INSTALL DEPENDENCIES (also builds Angular frontend) ──
      - name: Install dependencies
        run: npm ci
        # npm ci = clean install, uses package-lock.json exactly
        # postinstall hook also runs: cd frontend && npm ci && npm run build

      # ── 3b. DEPENDENCY VULNERABILITY SCAN ────────────────
      - name: Scan dependencies (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true
        # Juice Shop has known vulns by design — set to true for now
        # Change to false once you've reviewed the audit report

      # ── 4. TYPESCRIPT COMPILE CHECK ───────────────────────
      - name: TypeScript compile check
        run: npx tsc --noEmit
        # Ensures TypeScript compiles without errors before building Docker

      # ── 5. BUILD DOCKER IMAGE ─────────────────────────────
      - name: Build Docker image
        run: |
          docker build -t juice-shop:${{ github.sha }} .
          docker tag juice-shop:${{ github.sha }} juice-shop:latest

      # ── 6. RUN APPLICATION CONTAINER ─────────────────────
      - name: Start application container
        run: |
          docker run -d --name juice-shop \
            -p 3000:3000 \
            -e NODE_ENV=production \
            juice-shop:${{ github.sha }}
          echo "Waiting for Juice Shop to be ready..."
          timeout 120 bash -c \
            'until curl -sf http://localhost:3000/rest/admin/application-version; \
             do echo "Not ready yet..."; sleep 5; done'
          echo "Application is up!"

      # ── 7. OWASP ZAP BASELINE SECURITY SCAN ──────────────
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: true
          # -a = include ajax spider (handles Angular SPA routes)
          # -j = use ZAP's Ajax spider for JS-heavy pages
          # fail_action: true = pipeline FAILS if HIGH/MEDIUM alerts found

      # ── 8. UPLOAD ZAP REPORT AS ARTIFACT ─────────────────
      - name: Upload ZAP security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: |
            report_html.html
            report_json.json
          retention-days: 30

      # ── 9. STOP CONTAINER ─────────────────────────────────
      - name: Stop container
        if: always()
        run: docker stop juice-shop || true

  # ── PRODUCTION DEPLOY JOB (runs only on master branch) ───
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t juice-shop:production .

      - name: Deploy via Docker Compose
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build
          echo "Production deployed successfully"
          docker compose ps
